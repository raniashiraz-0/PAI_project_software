; =============================================================================
;  PHARMA ROVER - ESP32 FIRMWARE (PlatformIO)
;
;  VS Code -> File -> Open Folder -> this "firmware" folder.
;  Left bar: PlatformIO (alien icon) -> PROJECT TASKS -> pick a board:
;     esp32_main   -> Upload / Monitor   (main ESP32, COM3)
;     esp32_cam    -> Upload / Monitor   (ESP32-CAM on the MB adapter)
;
;  The Arduino Uno + TFT is NOT here: it is uploaded with the Arduino IDE from
;  ../arduino/uno_tft_display (COM4). The ports are fixed below, so PlatformIO
;  never touches the Uno's COM4 and the two programs never get in each other's way.
;  Only libraries that come with the ESP32 core are used - nothing to install.
; =============================================================================python start_all.py

[platformio]
; The blue bottom-bar Upload button uses this board. Use the sidebar (PROJECT TASKS)
; for the ESP32-CAM, or click "Default (firmware)" in the bottom bar to switch.
default_envs = esp32_main

; ---------------- settings shared by the two ESP32 boards ----------------
[esp32_common]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------------- MAIN ESP32: base + 4 ultrasonic + arm (2x PCA9685) + TFT relay ----------------
[env:esp32_main]
extends = esp32_common
board = esp32dev
upload_port = COM3
monitor_port = COM3
upload_speed = 921600
build_src_filter = +<esp32_main/>
build_flags = -DCORE_DEBUG_LEVEL=0

; ---------------- ESP32-CAM (AI-Thinker) on the gripper ----------------
; Uses the ESP32-CAM-MB adapter. If Windows gives it another COM number than the
; main ESP32 (check Device Manager), change these two lines.
[env:esp32_cam]
extends = esp32_common
board = esp32cam
upload_port = COM3
monitor_port = COM3
upload_speed = 460800
build_src_filter = +<esp32_cam/>
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
